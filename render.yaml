# Render Blueprint: one free API service in Singapore.
# PostgreSQL is on Supabase's free tier (DATABASE_URL = session pooler URL); the client is on
# Vercel (client/vercel.json), which forwards /api/* here.
# APP_ENV=staging keeps the game playable before the independent content review; switch to
# production once server/app/content/review.json is approved.
services:
  - type: web
    name: traders-edge-api
    runtime: docker
    region: singapore
    plan: free
    rootDir: server
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: staging
      - key: AUTH_MODE
        value: firebase
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
