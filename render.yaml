# Render Blueprint: the API for the guest demo (staging) and production, both on the free plan.
# PostgreSQL is hosted on Supabase's free tier (set DATABASE_URL to the session pooler URL); the client is on Vercel
# (client/vercel.json), which forwards /api/* here.
services:
  - type: web
    name: traders-edge-api-staging
    runtime: docker
    region: singapore
    plan: free
    rootDir: server
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: sh -c "python -m app.db && exec python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: staging
      - key: AUTH_MODE
        value: guest
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
  - type: web
    name: traders-edge-api
    runtime: docker
    region: singapore
    plan: free
    rootDir: server
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: sh -c "python -m app.db && exec python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTH_MODE
        value: firebase
      - key: DATABASE_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
