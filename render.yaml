# Render Blueprint: the API and PostgreSQL for the guest demo (staging) and production.
# The client is deployed separately on Vercel (client/vercel.json), which forwards /api/* here.
services:
  - type: web
    name: traders-edge-api-staging
    runtime: docker
    region: singapore
    plan: free
    rootDir: server
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: sh -c "python -m app.db && exec python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: staging
      - key: AUTH_MODE
        value: guest
      - key: DATABASE_URL
        fromDatabase:
          name: traders-edge-db-staging
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false
  - type: web
    name: traders-edge-api
    runtime: docker
    region: singapore
    plan: starter
    rootDir: server
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: sh -c "python -m app.db && exec python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTH_MODE
        value: firebase
      - key: DATABASE_URL
        fromDatabase:
          name: traders-edge-db
          property: connectionString
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/firebase-service-account.json
databases:
  - name: traders-edge-db-staging
    plan: free
    region: singapore
    databaseName: traders_edge
    user: traders_edge
  - name: traders-edge-db
    plan: basic-256mb
    region: singapore
    databaseName: traders_edge
    user: traders_edge
