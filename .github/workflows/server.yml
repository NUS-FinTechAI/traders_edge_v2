name: Server

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  lint:
    name: Test, API and Curriculum Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.12.23'
          python-version: '3.12'
          enable-cache: true

      - name: Install test dependencies
        run: uv sync --project server --extra test --locked

      - name: Test server
        run: uv run --project server --extra test --locked python -m unittest discover -s server/tests

      - name: Validate curriculum and its contract
        run: uv run --project server --extra test --locked python -m app.content.validate

      - name: Build server container
        run: docker build --tag traders-edge-server:ci ./server
