name: Checks

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  lint:
    name: Lint, types, build and API
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm --prefix client ci

      - name: Check lint and formatting
        run: npm run lint

      - name: Check types and build
        run: npm run typecheck && npm run build

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install API test dependencies
        run: |
          python -m pip install uv==0.12.23
          uv sync --project server --extra test --locked

      - name: Test API health
        run: uv run --project server --extra test --locked python -m unittest discover -s server/tests

      - name: Validate curriculum and its contract
        run: |
          uv run --project server --extra test --locked python -m app.content.validate
          uv run --project server --extra test --locked python -m unittest app.content.test_catalog
