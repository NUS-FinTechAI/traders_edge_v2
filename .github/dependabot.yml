version: 2

updates:
  - package-ecosystem: npm
    directories:
      - /
      - /client
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Major upgrades need a compatibility review (docs/open-source/roadmap.md).
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: uv
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Major upgrades need a compatibility review (docs/open-source/roadmap.md).
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
